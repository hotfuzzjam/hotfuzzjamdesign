# JWT verification per function. Functions with verify_jwt = false authenticate another way
# (Stripe signature, cron secret, or the booking's private manage token).
[functions.create-checkout]
verify_jwt = true

[functions.admin-action]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

[functions.buy-gift]
verify_jwt = false

[functions.manage-booking]
verify_jwt = false

[functions.send-reminders]
verify_jwt = false
