<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>HOTFUZZJAM Studio Admin</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap">
<style>
/* Layout: a working console. Summary tiles first, then one task per tab; tables collapse to cards on phones. */
:root{
  color-scheme:dark;
  --ground:#120A06; --ground-2:#1B110B; --ground-3:#271910;
  --ink:#EEE2D4; --ink-2:#A88F7E; --kin:#F2900F; --shu:#D2643C; --on-light:#120A06;
  --good:#8FBF7A; --warn:#E8B04A; --bad:#E07058;
  --line:rgba(238,226,212,.12); --line-strong:rgba(238,226,212,.26);
  --f:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --f-display:"HFJ Helvetica Condensed","Helvetica Neue Condensed Bold","Arial Narrow",sans-serif;
}
@font-face{font-family:"HFJ Helvetica Condensed";font-weight:700;src:local("HelveticaNeue-CondensedBold"),local("Helvetica Neue Condensed Bold")}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font:300 15px/1.55 var(--f);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--kin);outline-offset:2px}
.wrap{max-width:1280px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums lining-nums}
.label{font-weight:400;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
h1,h2,h3{margin:0;font-weight:400}
header{border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.brand img{width:34px;height:34px}
.brand b{font-weight:500;font-size:.78rem;letter-spacing:.3em}
.brand span{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
.chip{font-weight:400;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--kin);border:1px solid color-mix(in srgb,var(--kin) 55%,transparent);padding:.4em .7em;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;min-height:42px;padding:0 1.1em;border:1px solid var(--ink);background:var(--ink);color:var(--on-light);font-weight:500;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--kin);border-color:var(--kin)}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line-strong)}
.btn.ghost:hover{border-color:var(--ink);background:none}
.btn.sm{min-height:34px;padding:0 .8em;font-size:.62rem}
.btn.danger{background:none;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.btn.danger:hover{background:var(--bad);color:var(--on-light)}
.btn[disabled]{opacity:.4;cursor:default}
nav.tabs{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--ground);z-index:5}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:14px 12px 12px;cursor:pointer;font-weight:400;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--kin)}
nav.tabs .count{display:inline-block;min-width:1.6em;margin-left:.4em;padding:0 .4em;background:var(--ground-3);color:var(--ink);font-size:.62rem;border-radius:2px}
main{padding-block:28px 80px}
section.view{display:grid;gap:28px}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px}
.head h2{font-family:var(--f-display);font-weight:700;font-stretch:condensed;font-size:clamp(1.8rem,1.4rem + 1.6vw,2.6rem);text-transform:uppercase;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.kpi{background:var(--ground);padding:18px 18px 16px;display:grid;gap:6px;min-width:0}
.kpi .v{font-family:var(--f-display);font-weight:700;font-stretch:condensed;font-size:2.1rem;line-height:1}
.kpi .s{font-size:.78rem;color:var(--ink-2)}
.meter{height:4px;background:var(--ground-3);margin-top:4px}
.meter i{display:block;height:100%;background:var(--kin)}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:last-child{grid-column:1 / -1}}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);background:var(--ground-2);min-width:0}
.panel > .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel > .pb{padding:16px}
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .t{font-size:.9rem}
.list .who{min-width:0}
.list .who b{font-weight:400;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .who span{font-size:.78rem;color:var(--ink-2)}
.empty{padding:22px 16px;color:var(--ink-2);font-size:.9rem}
.pill{display:inline-block;font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;font-weight:500;padding:.38em .6em;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.off{color:var(--ink-2)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-strong)}
.seg button{background:none;border:0;padding:0 .9em;min-height:38px;cursor:pointer;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.seg button + button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-light)}
input.search,.f input,.f select,.f textarea{background:var(--ground);border:1px solid var(--line-strong);padding:.6rem .7rem;min-height:40px;border-radius:0;width:100%;font-size:16px}
input.search{width:min(280px,100%)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-weight:400;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);padding:12px 12px;border-bottom:1px solid var(--line-strong);white-space:nowrap;background:var(--ground-2)}
td{padding:12px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.sub,td .sub{display:block;font-size:.76rem;color:var(--ink-2)}
.acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.confirm{display:grid;gap:8px;justify-items:end;font-size:.82rem}
.confirm label{display:flex;gap:6px;align-items:center}
@media (max-width:760px){
  .tbl-wrap{border:0;overflow:visible}
  table.cards thead{display:none}
  table.cards,table.cards tbody,table.cards tr,table.cards td{display:block;width:100%}
  table.cards tr{border:1px solid var(--line);background:var(--ground-2);margin-bottom:10px;padding:6px 0}
  table.cards td{border:0;padding:6px 14px;display:flex;justify-content:space-between;gap:12px;text-align:right}
  table.cards td::before{content:attr(data-l);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding-top:.2em}
  table.cards td.acts-cell{display:block}
  table.cards td.acts-cell::before{display:none}
  .acts{justify-content:flex-start}
  .list li{grid-template-columns:86px 1fr;}
  .list li > :last-child{grid-column:1 / -1}
}
.grid-form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:end}
.grid-form .wide{grid-column:span 2}
.grid-form .full{grid-column:1 / -1}
@media (max-width:760px){.grid-form{grid-template-columns:1fr 1fr}.grid-form .wide{grid-column:1 / -1}}
.f{display:grid;gap:6px;min-width:0}
.f label{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);font-weight:400}
.f .hint{font-size:.74rem;color:var(--ink-2)}
.check{display:flex;gap:8px;align-items:center;min-height:40px;font-size:.9rem;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--kin)}
.msg{font-size:.85rem;min-height:1.2em}
.msg.err{color:var(--bad)} .msg.ok{color:var(--good)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on-light);padding:12px 18px;font-size:.85rem;z-index:20;max-width:calc(100vw - 32px)}
.login{min-height:calc(100vh - 66px);display:grid;place-items:center;padding-block:40px}
.login form{width:min(380px,100%);display:grid;gap:16px;border:1px solid var(--line);background:var(--ground-2);padding:28px}
.login h1{font-family:var(--f-display);font-weight:700;font-stretch:condensed;font-size:2.2rem;text-transform:uppercase;line-height:1}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85rem;letter-spacing:.04em}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="index.html"><img src="assets/favicon.png" alt=""><div><b>HOTFUZZJAM</b><br><span>Studio admin</span></div></a>
    <div style="display:flex;gap:10px;align-items:center">
      <span class="chip" id="modeChip" hidden>Preview data</span>
      <span class="muted" id="who" style="font-size:.8rem"></span>
      <button class="btn ghost sm" id="signOut" hidden>Sign out</button>
    </div>
  </div>
</header>

<div class="login wrap" id="login" hidden>
  <form id="loginForm" novalidate>
    <h1>Studio login</h1>
    <p class="muted" style="margin:0;font-size:.9rem">Owner and staff accounts only.</p>
    <div class="f"><label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="email" required></div>
    <div class="f"><label for="lPass">Password</label><input id="lPass" type="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit">Sign in</button>
    <p class="msg" id="lMsg" role="status"></p>
  </form>
</div>

<div id="app" hidden>
  <nav class="tabs" aria-label="Sections"><div class="wrap" role="tablist" id="tabs"></div></nav>
  <main class="wrap" id="main"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* Same project as the public site. Leave empty for preview data. */
const CONFIG = { SUPABASE_URL: '', SUPABASE_ANON_KEY: '' };

const TZ = 'Australia/Brisbane';
const live = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase);
const sb = live ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;
const fmt = o => new Intl.DateTimeFormat('en-AU', { timeZone: TZ, ...o });
const fDay = fmt({ weekday:'short', day:'numeric', month:'short' }), fTime = fmt({ hour:'2-digit', minute:'2-digit', hour12:false });
const fDate = fmt({ day:'numeric', month:'short', year:'numeric' });
const cash = c => `$${((c||0)/100).toLocaleString('en-AU', { minimumFractionDigits: (c||0) % 100 ? 2 : 0, maximumFractionDigits: 2 })}`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const hrs = b => Math.round((new Date(b.ends_at) - new Date(b.starts_at)) / 36e5);
const bneISO = (dateStr, hour) => new Date(`${dateStr}T${String(hour).padStart(2,'0')}:00:00+10:00`).toISOString();
const todayStr = () => new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(new Date());
const collected = b => (b.paid_cents || 0) - (b.refunded_cents || 0) + (b.studio_paid_cents || 0);
const owing = b => b.status === 'confirmed' ? Math.max(0, (b.due_cents || 0) - (b.paid_cents || 0) - (b.studio_paid_cents || 0)) : 0;

/* ---------------- data ---------------- */
function demoData(){
  const names = [['Mara Quinn','Static Bloom'],['Theo Park','Low Tide Club'],['Jas Nguyen','Feral Choir'],['Ruby Hale','The Sunbleached'],['Kofi Mensah','Paper Lions'],['Ellie Moss',''],['Sam Iredale','Night Swim']];
  const out = []; let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const base = new Date(todayStr() + 'T00:00:00+10:00');
  for (let d = -20; d < 21; d++){
    let h = 10 + Math.floor(rnd()*3);
    while (h < 21){
      if (rnd() < .55){
        const len = 1 + Math.floor(rnd()*3), n = names[Math.floor(rnd()*names.length)];
        const start = new Date(+base + d*864e5 + h*36e5), end = new Date(+start + len*36e5);
        const amount = 4000*len, mode = rnd() < .5 ? 'deposit' : rnd() < .5 ? 'full' : 'on_arrival';
        const coupon = rnd() < .15 ? 'LOUD10' : null, discount = coupon ? amount/10 : 0, due = amount - discount;
        const paid = mode === 'full' ? due : mode === 'deposit' ? Math.ceil(due/2) : 0;
        const cancelled = rnd() < .08;
        out.push({ id:'d'+out.length, manage_token:'t'+out.length, room_id:'a', starts_at:start.toISOString(), ends_at:end.toISOString(),
          status: cancelled ? 'cancelled' : 'confirmed', contact_name:n[0], band_name:n[1] || null, contact_email:n[0].split(' ')[0].toLowerCase()+'@example.com',
          phone: rnd() < .5 ? '+61412345678' : null, sms_opt_in: rnd() < .4, amount_cents:amount, discount_cents:discount, gift_applied_cents:0, due_cents:due,
          paid_cents:paid, refunded_cents: cancelled ? paid : 0, studio_paid_cents: d < 0 && !cancelled ? due - paid : 0, pay_mode:mode,
          payment_status: cancelled && paid ? 'refunded' : paid >= due ? 'paid' : paid ? 'deposit_paid' : 'unpaid', coupon_code:coupon, source:'web',
          stripe_payment_intent: paid ? 'pi_demo' : null, created_at:new Date(+start - 5*864e5).toISOString(), notes: rnd() < .2 ? 'Bringing a second kick pedal' : null, rooms:{ name:'The Room' } });
        h += len + Math.floor(rnd()*2);
      } else h += 1;
    }
  }
  const t = todayStr(), plus = n => new Date(+new Date(t+'T12:00:00+10:00') + n*864e5).toISOString().slice(0,10);
  return {
    bookings: out,
    blackouts: [{ id:'x1', room_id:null, starts_at:bneISO(plus(12),10), ends_at:bneISO(plus(12),23), reason:'PA service' }],
    coupons: [{ code:'LOUD10', kind:'percent', value:10, active:true, uses:6, max_uses:null, min_hours:1, expires_at:null, note:'Launch offer' },
              { code:'FIRSTJAM', kind:'amount', value:2000, active:true, uses:2, max_uses:50, min_hours:2, expires_at:null, note:'First session' }],
    gifts: [{ code:'HFJ-7KQ2-M9XA', initial_cents:16000, balance_cents:8000, status:'active', purchaser_name:'Jules Rowe', purchaser_email:'jules@example.com', recipient_name:'Sam', recipient_email:'sam@example.com', created_at:new Date(Date.now()-9*864e5).toISOString() },
            { code:'HFJ-P3LD-2RWE', initial_cents:8000, balance_cents:8000, status:'active', purchaser_name:'Ana Silva', purchaser_email:'ana@example.com', recipient_name:'Leo', recipient_email:'leo@example.com', created_at:new Date(Date.now()-2*864e5).toISOString() }],
    waitlist: [{ id:'w1', day:plus(3), from_hour:17, to_hour:22, hours_needed:2, name:'Ruby Hale', email:'ruby@example.com', status:'waiting', created_at:new Date().toISOString() },
               { id:'w2', day:plus(5), from_hour:12, to_hour:18, hours_needed:3, name:'Kofi Mensah', email:'kofi@example.com', status:'notified', notified_at:new Date().toISOString(), created_at:new Date().toISOString() }],
    profiles: names.map((n,i) => ({ id:'p'+i, full_name:n[0], band_name:n[1], phone:i % 2 ? '0412 345 678' : null, created_at:new Date(Date.now()-(30+i*9)*864e5).toISOString() })),
    settings: { open_hour:10, close_hour:23, max_hours:4, days_ahead:60, cancel_cutoff_hours:24, payment_mode:'choice', deposit_pct:50, hold_minutes:30, followup_delay_hours:2, sms_enabled:true },
    rate_cents: 4000
  };
}
let D = null;
const Store = live ? {
  async load(){
    const from = new Date(Date.now() - 120*864e5).toISOString();
    const [b, x, c, g, w, p, s, r] = await Promise.all([
      sb.from('bookings').select('*, rooms(name)').gte('starts_at', from).order('starts_at'),
      sb.from('blackouts').select('*').gte('ends_at', new Date().toISOString()).order('starts_at'),
      sb.from('coupons').select('*').order('created_at', { ascending:false }),
      sb.from('gift_cards').select('*').neq('status','pending').order('created_at', { ascending:false }),
      sb.from('waitlist').select('*').gte('day', todayStr()).order('day'),
      sb.from('profiles').select('*').order('created_at', { ascending:false }),
      sb.from('settings').select('*').eq('id',1).single(),
      sb.from('rooms').select('rate_cents').eq('id','a').single()
    ]);
    const err = [b,x,c,g,w,p,s,r].find(q => q.error); if (err) throw err.error;
    D = { bookings:b.data, blackouts:x.data, coupons:c.data, gifts:g.data, waitlist:w.data, profiles:p.data, settings:s.data, rate_cents:r.data.rate_cents };
  },
  async action(body){ const { data, error } = await sb.functions.invoke('admin-action', { body }); if (error){ let j; try { j = await error.context.json(); } catch(e){} throw new Error(j?.error || 'That didn\'t work.'); } return data; },
  async markPaid(b){ const { error } = await sb.from('bookings').update({ studio_paid_cents: Math.max(0, b.due_cents - b.paid_cents), payment_status:'paid' }).eq('id', b.id); if (error) throw error; },
  async addBlackout(x){ const { error } = await sb.from('blackouts').insert(x); if (error) throw error; },
  async delBlackout(id){ const { error } = await sb.from('blackouts').delete().eq('id', id); if (error) throw error; },
  async saveCoupon(c){ const { error } = await sb.from('coupons').insert(c); if (error) throw error; },
  async toggleCoupon(code, active){ const { error } = await sb.from('coupons').update({ active }).eq('code', code); if (error) throw error; },
  async delCoupon(code){ const { error } = await sb.from('coupons').delete().eq('code', code); if (error) throw error; },
  async voidGift(code){ const { error } = await sb.from('gift_cards').update({ status:'void' }).eq('code', code); if (error) throw error; },
  async setGiftBalance(code, cents){ const { error } = await sb.from('gift_cards').update({ balance_cents:cents }).eq('code', code); if (error) throw error; },
  async delWait(id){ const { error } = await sb.from('waitlist').delete().eq('id', id); if (error) throw error; },
  async saveSettings(s, rate){ const a = await sb.from('settings').update({ ...s, updated_at:new Date().toISOString() }).eq('id',1); if (a.error) throw a.error; const b = await sb.from('rooms').update({ rate_cents:rate }).eq('id','a'); if (b.error) throw b.error; }
} : {
  async load(){ if (!D) D = demoData(); },
  async action(body){
    if (body.action === 'create_booking'){
      const amount = Number.isFinite(body.amount_cents) ? body.amount_cents : D.rate_cents * Math.round((new Date(body.ends_at) - new Date(body.starts_at))/36e5);
      if (D.bookings.some(b => b.status === 'confirmed' && new Date(b.starts_at) < new Date(body.ends_at) && new Date(b.ends_at) > new Date(body.starts_at))) throw new Error('That time overlaps another booking or a block-out.');
      D.bookings.push({ id:'n'+Date.now(), manage_token:'tn', room_id:'a', starts_at:body.starts_at, ends_at:body.ends_at, status:'confirmed', contact_name:body.contact_name, band_name:body.band_name, contact_email:body.contact_email, phone:body.phone, amount_cents:amount, discount_cents:0, gift_applied_cents:0, due_cents:amount, paid_cents:0, refunded_cents:0, studio_paid_cents:0, pay_mode:'on_arrival', payment_status:'unpaid', source:'admin', notes:body.notes, created_at:new Date().toISOString(), rooms:{ name:'The Room' } });
      D.bookings.sort((a,b) => a.starts_at.localeCompare(b.starts_at)); return {};
    }
    const b = D.bookings.find(x => x.id === body.booking_id);
    if (body.action === 'cancel'){ const owed = body.refund ? b.paid_cents - b.refunded_cents : 0; Object.assign(b, { status:'cancelled', refunded_cents: b.refunded_cents + owed, payment_status: owed ? 'refunded' : b.payment_status }); return { refunded_cents: owed }; }
    return { sent:true };
  },
  async markPaid(b){ b.studio_paid_cents = Math.max(0, b.due_cents - b.paid_cents); b.payment_status = 'paid'; },
  async addBlackout(x){ D.blackouts.push({ id:'x'+Date.now(), ...x }); D.blackouts.sort((a,b) => a.starts_at.localeCompare(b.starts_at)); },
  async delBlackout(id){ D.blackouts = D.blackouts.filter(x => x.id !== id); },
  async saveCoupon(c){ if (D.coupons.some(x => x.code === c.code)) throw new Error('That code already exists.'); D.coupons.unshift({ uses:0, ...c }); },
  async toggleCoupon(code, active){ D.coupons.find(c => c.code === code).active = active; },
  async delCoupon(code){ D.coupons = D.coupons.filter(c => c.code !== code); },
  async voidGift(code){ D.gifts.find(g => g.code === code).status = 'void'; },
  async setGiftBalance(code, cents){ D.gifts.find(g => g.code === code).balance_cents = cents; },
  async delWait(id){ D.waitlist = D.waitlist.filter(w => w.id !== id); },
  async saveSettings(s, rate){ Object.assign(D.settings, s); D.rate_cents = rate; }
};

function statusPill(b){
  if (b.status === 'cancelled') return `<span class="pill off">Cancelled</span>`;
  if (b.status === 'pending') return `<span class="pill warn">Awaiting payment</span>`;
  if (b.payment_status === 'paid' || owing(b) === 0) return `<span class="pill ok">Paid</span>`;
  if (b.payment_status === 'deposit_paid') return `<span class="pill warn">Deposit paid</span>`;
  return `<span class="pill warn">Pay at studio</span>`;
}

      <div class="f"><label for="stAhead">Book ahead</label>${sel('stAhead', [14,30,60,90,180].map(n => [n, n+' days']), s.days_ahead)}</div>
      <div class="f"><label for="stFollow">Follow-up email</label>${sel('stFollow', [[1,'1 hr after'],[2,'2 hrs after'],[24,'Next day']], s.followup_delay_hours)}</div>
      <label class="check wide"><input type="checkbox" id="stSms" ${s.sms_enabled ? 'checked' : ''}> Offer SMS reminders (Twilio, about 6–8c per text)</label>
      <div class="full" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn" type="submit">Save settings</button><p class="msg" id="stMsg" role="status"></p></div>
    </form>
    <p class="muted" style="font-size:.85rem;margin:0">Changes apply to new bookings straight away. Existing bookings keep their price and payment.</p>
  </section>`;
}
const VIEWS = { overview:vOverview, bookings:vBookings, new:vNew, blackouts:vBlackouts, coupons:vCoupons, gifts:vGifts, waitlist:vWaitlist, clients:vClients, settings:vSettings };

function render(){
  const owingN = D.bookings.filter(b => owing(b) > 0 && +new Date(b.ends_at) < Date.now() + 864e5).length;
  const waitN = D.waitlist.filter(w => w.status === 'waiting').length;
  document.getElementById('tabs').innerHTML = TABS.map(([k,l]) => `<button role="tab" data-tab="${k}" aria-selected="${ui.tab === k}">${l}${k === 'waitlist' && waitN ? `<span class="count num">${waitN}</span>` : ''}${k === 'bookings' && owingN ? `<span class="count num" title="Owing within a day">${owingN}</span>` : ''}</button>`).join('');
  document.getElementById('main').innerHTML = VIEWS[ui.tab]();
}

/* ---------------- events ---------------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  const run = async (fn, ok) => { t.disabled = true; try { await fn(); if (ok) toast(ok); } catch(err){ toast(err.message || 'That didn\'t work.'); } render(); };
  if (d.tab || d.go){ ui.tab = d.tab || d.go; ui.q = ''; ui.confirm = null; history.replaceState(null, '', '#' + ui.tab); render(); scrollTo(0,0); }
  else if (d.range){ ui.range = d.range; ui.confirm = null; render(); }
  else if (d.cancel){ ui.confirm = d.cancel; ui.refund = true; render(); }
  else if ('cancelNo' in d){ ui.confirm = null; render(); }
  else if (d.cancelGo){ const refund = document.getElementById('cRefund')?.checked ?? false; await run(async () => { const r = await Store.action({ action:'cancel', booking_id:d.cancelGo, refund }); ui.confirm = null; if (live) await Store.load(); }, refund ? 'Cancelled and refunded.' : 'Cancelled.'); }
  else if (d.paid){ const b = D.bookings.find(x => x.id === d.paid); await run(async () => { await Store.markPaid(b); if (live) await Store.load(); }, `Marked ${cash(owing(b) || b.due_cents)} paid at the studio.`); }
  else if (d.resend){ await run(() => Store.action({ action:'resend', booking_id:d.resend }), live ? 'Confirmation resent.' : 'Preview: no email sent.'); }
  else if (d.delBo){ await run(async () => { await Store.delBlackout(d.delBo); if (live) await Store.load(); }, 'Block-out removed.'); }
  else if (d.cpToggle){ const c = D.coupons.find(x => x.code === d.cpToggle); await run(async () => { await Store.toggleCoupon(c.code, !c.active); if (live) await Store.load(); }, c.active ? 'Code paused.' : 'Code active.'); }
  else if (d.cpDel){ await run(async () => { await Store.delCoupon(d.cpDel); if (live) await Store.load(); }, 'Code deleted.'); }
  else if (d.gfVoid){ await run(async () => { await Store.voidGift(d.gfVoid); if (live) await Store.load(); }, 'Gift card voided.'); }
  else if (d.gfBal){
    const g = D.gifts.find(x => x.code === d.gfBal); const td = t.closest('td');
    td.innerHTML = `<div class="confirm"><label>New balance $ <input type="number" min="0" max="${g.initial_cents/100}" step="1" value="${g.balance_cents/100}" id="gfIn" style="width:90px;background:var(--ground);border:1px solid var(--line-strong);padding:.4rem"></label><div class="acts"><button class="btn sm" data-gf-save="${esc(g.code)}">Save</button><button class="btn ghost sm" data-cancel-no>Cancel</button></div></div>`;
  }
  else if (d.gfSave){ const v = Math.round(+document.getElementById('gfIn').value * 100); await run(async () => { await Store.setGiftBalance(d.gfSave, Math.max(0, v)); if (live) await Store.load(); }, 'Balance updated.'); }
  else if (d.wlDel){ await run(async () => { await Store.delWait(d.wlDel); if (live) await Store.load(); }, 'Removed from the waitlist.'); }
  else if (t.id === 'signOut'){ if (live) await sb.auth.signOut(); location.reload(); }
});
document.addEventListener('input', e => { if (e.target.id === 'q'){ ui.q = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById('q'); q.focus(); q.setSelectionRange(pos, pos); } });
document.addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target; const v = id => document.getElementById(id)?.value?.trim(); const msg = (id, t, ok) => { const el = document.getElementById(id); el.textContent = t; el.className = 'msg ' + (ok ? 'ok' : 'err'); };
  const btn = f.querySelector('[type=submit]'); btn.disabled = true;
  try {
    if (f.id === 'newForm'){
      const start = bneISO(v('nDay'), +v('nStart')), end = new Date(+new Date(start) + (+v('nLen'))*36e5).toISOString();
      if (!v('nName') && !v('nBand')) throw new Error('Add a name or band so you know who it is.');
      await Store.action({ action:'create_booking', starts_at:start, ends_at:end, contact_name:v('nName'), band_name:v('nBand'), contact_email:v('nEmail') || null, phone:v('nPhone') || null, notes:v('nNotes') || null,
        amount_cents: v('nAmt') === '' ? undefined : Math.round(+v('nAmt')*100), notify: document.getElementById('nNotify').checked && !!v('nEmail'), sms_opt_in: document.getElementById('nSms').checked });
      if (live) await Store.load(); ui.tab = 'bookings'; ui.range = 'upcoming'; render(); toast('Booking added.'); return;
    }
    if (f.id === 'boForm'){
      const from = +v('boFrom'), to = +v('boTo'), days = +v('boDays');
      if (to <= from) throw new Error('"Until" has to be after "From".');
      for (let i = 0; i < days; i++){ const day = new Date(+new Date(v('boDay') + 'T12:00:00+10:00') + i*864e5).toISOString().slice(0,10); await Store.addBlackout({ room_id:null, starts_at:bneISO(day, from), ends_at:bneISO(day, to), reason:v('boReason') || null }); }
      if (live) await Store.load(); render(); toast(days > 1 ? `Closed for ${days} days.` : 'Block-out added.'); return;
    }
    if (f.id === 'cpForm'){
      const code = (v('cpCode') || '').toUpperCase();
      if (!/^[A-Z0-9_-]{3,24}$/.test(code)) throw new Error('Codes are 3–24 letters, numbers, - or _.');
      const kind = v('cpKind'), val = +v('cpVal'); if (!(val > 0)) throw new Error('Enter a discount value.'); if (kind === 'percent' && val > 100) throw new Error('Percent codes go up to 100.');
      await Store.saveCoupon({ code, kind, value: kind === 'percent' ? Math.round(val) : Math.round(val*100), min_hours:+v('cpMin') || 1, max_uses: v('cpMax') ? +v('cpMax') : null, expires_at: v('cpExp') ? new Date(v('cpExp') + 'T23:59:59+10:00').toISOString() : null, note:v('cpNote') || null, active:true });
      if (live) await Store.load(); render(); toast(`${code} is live.`); return;
    }
    if (f.id === 'stForm'){
      const s = { open_hour:+v('stOpen'), close_hour:+v('stClose'), max_hours:+v('stMax'), payment_mode:v('stPay'), deposit_pct:+v('stDep'), cancel_cutoff_hours:+v('stCut'), days_ahead:+v('stAhead'), followup_delay_hours:+v('stFollow'), sms_enabled:document.getElementById('stSms').checked };
      if (s.close_hour <= s.open_hour) throw new Error('Closing time has to be after opening time.');
      const rate = Math.round(+v('stRate')*100); if (!(rate > 0)) throw new Error('Enter an hourly rate.');
      await Store.saveSettings(s, rate); if (live) await Store.load(); msg('stMsg', 'Saved.', true); return;
    }
  } catch(err){ const id = { newForm:'nMsg', boForm:'boMsg', cpForm:'cpMsg', stForm:'stMsg' }[f.id]; msg(id, err.message || 'That didn\'t work.'); }
  finally { btn.disabled = false; }
});

/* ---------------- boot ---------------- */
async function start(){
  try { await Store.load(); } catch(err){ document.getElementById('main').innerHTML = `<div class="panel"><p class="empty">${esc(err.message || 'Couldn\'t load studio data.')}</p></div>`; }
  document.getElementById('app').hidden = false; document.getElementById('login').hidden = true;
  document.getElementById('signOut').hidden = !live; document.getElementById('modeChip').hidden = live;
  if (D) render();
}
(async () => {
  if (!live) return start();
  const { data } = await sb.auth.getSession();
  const check = async (session) => {
    if (!session){ document.getElementById('login').hidden = false; document.getElementById('app').hidden = true; return; }
    const { data: isAdmin } = await sb.rpc('is_admin');
    document.getElementById('who').textContent = session.user.email;
    if (!isAdmin){ document.getElementById('login').hidden = false; const m = document.getElementById('lMsg'); m.textContent = 'This account isn\'t a studio admin. Ask the owner to add it in Supabase.'; m.className = 'msg err'; document.getElementById('signOut').hidden = false; return; }
    start();
  };
  await check(data.session);
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault(); const m = document.getElementById('lMsg');
    const { data, error } = await sb.auth.signInWithPassword({ email: document.getElementById('lEmail').value.trim(), password: document.getElementById('lPass').value });
    if (error){ m.textContent = error.message; m.className = 'msg err'; return; }
    check(data.session);
  });
})();
</script>
</body>
